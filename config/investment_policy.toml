schema_version = 1

[account]
broker = "BCS"
account_type = "IIS"
interface = "CODEX"

[objective]
base_currency = "RUB"
horizon_min_years = 5
horizon_max_years = 10
current_target_annual_return = 0.20
target_is_guarantee = false
primary_benchmark = "Russian bank deposit rate indicator; exact series to be fixed in data phase"
secondary_benchmark = "Relevant Russian bond total-return index; exact index to be fixed in data phase"

[portfolio]
primary_asset_class = "BOND"
target_bond_share = 0.90
target_bond_share_is_hard_limit = false
allow_ofz = true
cash_reserve_min_share = 0.00
cash_reserve_is_dynamic = true
regular_contribution_rub = 50000
regular_contribution_is_guaranteed = false
blocked_foreign_positions_are_hold_only = true

[risk]
warning_drawdown = 0.10
maximum_drawdown = 0.15
avoid_default_intent = true
dynamic_credit_risk_budget = true
fundamental_review_required = true
macro_scenarios_required = true

[analytics]
# Diagnostic signals only; these are not hard trading limits.
position_concentration_warning_share = 0.20
material_blocked_share = 0.05

[credit]
# Freshness diagnostic only. A recent rating does not imply low default risk.
rating_max_age_days = 400

[fundamentals]
# Diagnostic thresholds only. Standalone RAS is not consolidated group data.
financial_max_age_days = 550
revenue_decline_warning = 0.10
interest_coverage_warning = 1.00
current_ratio_warning = 1.00
debt_to_equity_warning = 3.00
near_term_event_days = 365

[manager]
# Fast recommendation hot path. These are allocation guards, not trade orders.
max_bond_issuer_share_after_add = 0.15
speculative_reduce_fraction = 0.50
minimum_allocation_rub = 5000
allocation_rounding_rub = 100
maximum_single_purchase_share_of_cash = 0.40

[rate_model]
# Transparent 12-month sensitivities. Scenario shifts are assumptions, not forecasts.
horizon_months = 12
long_duration_threshold_days = 730
corporate_rate_pass_through = 0.75

[[rate_model.scenarios]]
code = "FAST_EASING"
label = "Быстрое снижение ставки"
key_rate_change_percent = -4.0

[[rate_model.scenarios]]
code = "BASE_EASING"
label = "Умеренное снижение ставки"
key_rate_change_percent = -1.5

[[rate_model.scenarios]]
code = "HIGHER_FOR_LONGER"
label = "Ставка остаётся высокой"
key_rate_change_percent = 1.0

[universe]
# Fast MOEX shortlist before exact proposal construction. Not an order universe.
board_id = "TQCB"
pre_credit_limit = 16
result_limit = 5
minimum_yield_percent = 20.0
maximum_yield_percent = 30.0
minimum_duration_days = 90
maximum_duration_days = 1200
minimum_days_to_maturity = 180
minimum_issue_notional_rub = 1000000000
minimum_turnover_rub = 500000
maximum_lot_share_of_cash = 0.25
maximum_list_level = 2

[trading]
mode = "RECOMMEND_AND_CONFIRM"
allowed_instrument_types = ["BOND", "STOCK", "FUND"]
allowed_currency = "RUB"
limit_orders_only = true
explicit_external_approval_required = true
approval_ttl_seconds = 600
order_validity_seconds = 3600
maximum_quote_age_seconds = 60
max_price_drift_bps = 25
allow_margin = false
allow_derivatives = false
allow_foreign_purchases = false
allow_withdrawals = false
allow_asset_transfers = false
